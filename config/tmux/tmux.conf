# Prefix: Ctrl+b
set -g prefix C-b
unbind-key -T prefix C-b
bind-key -T prefix C-b send-prefix

set -g mouse on
set -g focus-events on
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g detach-on-destroy off
set -g status-position top
set -g status-interval 30
set -g status-left '#S '
set -g status-right '#(~/.config/tmux/status-right.sh) %H:%M'

# Splits only (click panes/windows with the mouse)
bind-key -T prefix v split-window -h
bind-key -T prefix u split-window -v

# Reload config
bind-key -T prefix r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
