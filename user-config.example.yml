# Optional: copy to user-config.yml and edit. If missing, ./install.sh prompts and creates user-config.yml.
user:
  name: Your Name
  email: your_email@example.com

github:
  username: your-github-username

# Obsidian notes vault for Ctrl+N ripgrep search (override path; $HOME is expanded)
notes:
  directory: $HOME/Library/Mobile Documents/iCloud~md~obsidian/Documents/_Notes_
